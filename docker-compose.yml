services:
  hermes-db:
    build:
      context: .
      dockerfile_inline: |
        FROM postgis/postgis
        RUN apt-get update \
            && apt-get install -y --no-install-recommends postgresql-$$PG_MAJOR-pgvector \
            && rm -rf /var/lib/apt/lists/*
    restart: always
    env_file:
      - .env.development
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - hermes_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  hermes-api:
    build:
      context: ./apps/hermes-api
      dockerfile: Dockerfile
    ports:
      - '${API_PORT}:8000'
    volumes:
      - ./apps/hermes-api/src:/app/src
    env_file:
      - .env.development
      - ./apps/hermes-api/.env.development
      - ./apps/hermes-api/.env.local
    depends_on:
      hermes-db:
        condition: service_healthy
    restart: unless-stopped

  hermes:
    build:
      context: .
      dockerfile: apps/hermes/Dockerfile
    ports:
      - '${FRONTEND_PORT}:4200'
    volumes:
      - ./apps/hermes/app:/app/apps/hermes/app
      - ./apps/hermes/styles.css:/app/apps/hermes/styles.css
      - ./apps/hermes/public:/app/apps/hermes/public
      - ./libs:/app/libs
    env_file:
      - .env.development
      - ./apps/hermes/.env.development
      - ./apps/hermes/.env.local
    environment:
      HOST: 0.0.0.0
    restart: unless-stopped

volumes:
  hermes_data:
