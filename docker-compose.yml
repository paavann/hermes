services:
  hermes-db:
    image: postgis/postgis
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - hermes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  hermes-api:
    build:
      context: ./apps/hermes-api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./apps/hermes-api/src:/app/src
    environment:
      DB_HOST: hermes-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      hermes-db:
        condition: service_healthy
    restart: unless-stopped

  hermes:
    build:
      context: .
      dockerfile: apps/hermes/Dockerfile
    ports:
      - "${FRONTEND_PORT}:4200"
    volumes:
      - ./apps/hermes/app:/app/apps/hermes/app
      - ./apps/hermes/styles.css:/app/apps/hermes/styles.css
      - ./apps/hermes/public:/app/apps/hermes/public
      - ./libs:/app/libs
    environment:
      HOST: 0.0.0.0
      VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    restart: unless-stopped

volumes:
  hermes_data: