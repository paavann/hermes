[tool.coverage.run]
branch = true
source = [ "src" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../../coverage/libs/shared/utils/py/html'
 --cov-report xml:'../../../../coverage/libs/shared/utils/py/coverage.xml'
 --html='../../../../reports/libs/shared/utils/py/unittests/html/index.html'
 --junitxml='../../../../reports/libs/shared/utils/py/unittests/junit.xml'
"""

[project]
name = "utils-py"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = 'README.md'
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["utils_py"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
