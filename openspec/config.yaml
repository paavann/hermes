schema: spec-driven



# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  tasks:
    - Include a header comment at the top of tasks.md: <!-- apply-mode: step-by-step --> (default) or <!-- apply-mode: one-shot -->

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  apply:
    guidance:
      - BEFORE writing any code or executing any task, check if the user explicitly specified "one-shot" or "step-by-step" in their message.
      - If not specified, STOP and ask the user: "How would you like to apply this change? (1) Step-by-step (pause for review after each task) or (2) One-shot (execute all tasks at once)?"
      - Wait for the user's answer before starting Task 1.
      - IF the user chooses "one-shot": Execute all unchecked tasks in tasks.md sequentially in a single run, mark them [x], and summarize at the end.
      - IF the user chooses "step-by-step": Execute ONLY ONE unchecked task at a time, mark it [x], summarize the changes, and STOP immediately to wait for user review.
      - In "step-by-step" mode, if the user requests fixes during review, apply them to the current task and pause again for re-approval before moving on.

