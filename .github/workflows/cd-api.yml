name: deploy hermes-api

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: cd-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-changes:
    name: check affected api paths
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: detect api changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/hermes-api/**'
              - 'libs/shared/hermes-db/**'
              - 'libs/shared/hermes-ai/**'
              - 'libs/shared/utils/py/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/cd-api.yml'

  deploy-lightsail:
    name: build, push and deploy to lightsail
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: inspect aws region secret
        env:
          REGION_SECRET: ${{ secrets.AWS_REGION }}
          REGION_VAR: ${{ vars.AWS_REGION }}
        run: |
          echo "=== Debugging AWS_REGION configuration ==="
          if [ -z "$REGION_SECRET" ]; then
            echo "secrets.AWS_REGION is EMPTY or NOT CONFIGURED in repository secrets."
          else
            echo "Length of secrets.AWS_REGION: ${#REGION_SECRET} characters"
            # GitHub automatically masks exact secrets as '***'.
            # We space characters and print base64 so you can clearly see the value:
            echo -n "secrets.AWS_REGION (spaced): "
            echo "$REGION_SECRET" | sed 's/./& /g'
            echo -n "secrets.AWS_REGION (base64): "
            echo -n "$REGION_SECRET" | base64
          fi

          if [ -n "$REGION_VAR" ]; then
            echo "vars.AWS_REGION is: $REGION_VAR"
          else
            echo "vars.AWS_REGION is not set."
          fi
          echo "=========================================="

      - name: install lightsailctl plugin
        run: |
          echo "Installing lightsailctl..."
          sudo curl "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o "/usr/local/bin/lightsailctl"
          sudo chmod +x /usr/local/bin/lightsailctl
          lightsailctl --version

      - name: build production docker image
        run: |
          docker build \
            --target production \
            -t hermes-api:latest \
            -f apps/hermes-api/Dockerfile .

      - name: push image to lightsail container service
        id: push-image
        run: |
          SERVICE_NAME="hermes-api"
          LABEL="v-${{ github.sha }}"

          echo "pushing image to lightsail service $SERVICE_NAME in ap-southeast-2..."
          OUTPUT=$(aws lightsail push-container-image \
            --region ap-southeast-2 \
            --service-name "$SERVICE_NAME" \
            --label "$LABEL" \
            --image hermes-api:latest)
          echo "$OUTPUT"

          IMAGE_TAG=$(echo "$OUTPUT" | grep -oE ':[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\.[0-9]+' | head -n 1)
          if [ -z "$IMAGE_TAG" ]; then
            echo "Error: Failed to parse Lightsail image reference from output."
            exit 1
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: deploy revision to lightsail
        env:
          SERVICE_NAME: hermes-api
          IMAGE_TAG: ${{ steps.push-image.outputs.IMAGE_TAG }}
          PROD_ENV_SECRET: ${{ secrets.HERMES_API_PROD_ENV }}
        run: |
          echo "preparing deployment specification for $SERVICE_NAME..."

          # Generate containers.json with sanitized environment variables
          python3 -c "
          import os, json, subprocess

          raw_secret = os.environ.get('PROD_ENV_SECRET', '').strip()
          image_tag = os.environ['IMAGE_TAG']
          service_name = os.environ['SERVICE_NAME']
          env_dict = {}

          if raw_secret:
              print('Loading environment variables from HERMES_API_PROD_ENV secret...')
              for line in raw_secret.splitlines():
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  if '=' in line:
                      k, v = line.split('=', 1)
                      k, v = k.strip(), v.strip()
                      # Remove wrapping single or double quotes
                      if (v.startswith('\"') and v.endswith('\"')) or (v.startswith('\'') and v.endswith('\'')):
                          v = v[1:-1]
                      env_dict[k] = v
          else:
              print('HERMES_API_PROD_ENV secret is empty; falling back to existing Lightsail configuration...')
              cmd = [
                  'aws', 'lightsail', 'get-container-services',
                  '--region', 'ap-southeast-2',
                  '--service-name', service_name,
                  '--query', 'containerServices[0].currentDeployment.containers.*.environment | [0]',
                  '--output', 'json'
              ]
              res = subprocess.run(cmd, capture_output=True, text=True)
              try:
                  parsed = json.loads(res.stdout) if res.stdout.strip() else {}
                  if isinstance(parsed, dict):
                      env_dict = parsed
              except Exception:
                  pass

              if not env_dict:
                  print('No active deployment environment found; checking deployment history...')
                  hist_cmd = [
                      'aws', 'lightsail', 'get-container-service-deployments',
                      '--region', 'ap-southeast-2',
                      '--service-name', service_name,
                      '--query', 'deployments[0].containers.*.environment | [0]',
                      '--output', 'json'
                  ]
                  hist_res = subprocess.run(hist_cmd, capture_output=True, text=True)
                  try:
                      hist_parsed = json.loads(hist_res.stdout) if hist_res.stdout.strip() else {}
                      if isinstance(hist_parsed, dict):
                          env_dict = hist_parsed
                  except Exception:
                      pass

          print(f'Preserving environment keys: {sorted(list(env_dict.keys()))}')

          containers_payload = {
              'hermes-api': {
                  'image': image_tag,
                  'environment': env_dict,
                  'ports': {
                      '8000': 'HTTP'
                  }
              }
          }

          with open('containers.json', 'w') as f:
              json.dump(containers_payload, f, indent=2)
          "

          echo "deploying $IMAGE_TAG to $SERVICE_NAME using containers.json..."
          aws lightsail create-container-service-deployment \
            --region ap-southeast-2 \
            --service-name "$SERVICE_NAME" \
            --containers file://containers.json \
            --public-endpoint "{
              \"containerName\": \"hermes-api\",
              \"containerPort\": 8000,
              \"healthCheck\": {
                \"path\": \"/\",
                \"successCodes\": \"200-299\"
              }
            }"

          echo "Deployment initiated successfully!"
