name: CI/CD Pipeline

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.14'
  UV_VERSION: 'latest'

jobs:
  validate:
    name: lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: set up python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: install npm dependencies
        run: npm ci

      - name: sync python dependencies
        run: uv sync --frozen

      - name: run linters
        run: npm run lint

      - name: run tests
        run: npm test

  deploy-worker:
    name: deploy hermes worker
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/cd-worker.yml
    secrets: inherit

  deploy-frontend:
    name: deploy hermes frontend
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/cd-frontend.yml
    secrets: inherit
